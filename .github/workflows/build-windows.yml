name: build-windows
on:
  workflow_dispatch:
  push: { branches: [ main ] }
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
      - run: flutter doctor -v
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Regenerate windows platform files
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --org dev.sibyl --project-name sibyl_control .
          # flutter create writes the stock Flutter icon and the project-name
          # window title; restore our branding.
          Copy-Item assets/branding/app_icon.ico windows/runner/resources/app_icon.ico -Force
          $main = 'windows/runner/main.cpp'
          (Get-Content $main -Raw).Replace('L"sibyl_control"', 'L"Sibyl Control"') |
            Set-Content $main -NoNewline
          $rc = 'windows/runner/Runner.rc'
          (Get-Content $rc -Raw).
            Replace('VALUE "FileDescription", "sibyl_control"', 'VALUE "FileDescription", "Sibyl Control"').
            Replace('VALUE "ProductName", "sibyl_control"', 'VALUE "ProductName", "Sibyl Control"') |
            Set-Content $rc -NoNewline
          Select-String -Path $main -Pattern 'Sibyl Control'
          Select-String -Path $rc -Pattern 'ProductName'
      - run: flutter build windows --release
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          Set-Content -Path version.txt -Value $v -NoNewline
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found on this runner" }
          # OutputManifestFile is opened before ISCC creates OutputDir.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /Qp "/DMyAppVersion=$v" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length
          Write-Host '--- ISCC manifest (every packed file) ---'
          Get-Content dist\manifest.txt
      - name: Package
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          $v = Get-Content version.txt -Raw
          Compress-Archive -Path "$rel/*" -DestinationPath "sibyl_control_windows.zip" -Force
          (Get-FileHash sibyl_control_windows.zip -Algorithm SHA256).Hash | Tee-Object sha256.txt
          (Get-FileHash "dist/SibylControlSetup-$v.exe" -Algorithm SHA256).Hash |
            Tee-Object sha256-setup.txt
      - name: Upload to GitHub Release
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          TAG="winbuild-${{ github.run_id }}"
          curl -sf -X POST -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/preauthn1/sibyl-control-build/releases \
            -d '{"tag_name":"'"$TAG"'","name":"Windows build '"$TAG"'","prerelease":true}' > rel.json || true
          RID=$(python -c 'import json;print(json.load(open("rel.json"))["id"])')
          curl -sfL -X POST -H "Authorization: Bearer $GH_PAT" -H "Content-Type: application/zip" \
            --data-binary @sibyl_control_windows.zip \
            "https://uploads.github.com/repos/preauthn1/sibyl-control-build/releases/$RID/assets?name=sibyl_control_windows.zip"
          SETUP="SibylControlSetup-$(cat version.txt).exe"
          curl -sfL -X POST -H "Authorization: Bearer $GH_PAT" \
            -H "Content-Type: application/vnd.microsoft.portable-executable" \
            --data-binary "@dist/$SETUP" \
            "https://uploads.github.com/repos/preauthn1/sibyl-control-build/releases/$RID/assets?name=$SETUP"
          curl -sfL -X POST -H "Authorization: Bearer $GH_PAT" -H "Content-Type: text/plain" \
            --data-binary @dist/manifest.txt \
            "https://uploads.github.com/repos/preauthn1/sibyl-control-build/releases/$RID/assets?name=installer-manifest.txt"
          echo "zip   $(cat sha256.txt)"
          echo "setup $(cat sha256-setup.txt)"
