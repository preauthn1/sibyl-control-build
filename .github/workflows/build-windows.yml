name: build-windows
on:
  workflow_dispatch:
  push: { branches: [ main ] }
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
      - run: flutter doctor -v
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Regenerate windows platform files
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --org dev.sibyl --project-name sibyl_control .
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$rel/*" -DestinationPath "sibyl_control_windows.zip" -Force
          (Get-FileHash sibyl_control_windows.zip -Algorithm SHA256).Hash | Tee-Object sha256.txt
      - name: Upload to GitHub Release
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          TAG="winbuild-${{ github.run_id }}"
          curl -sf -X POST -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/preauthn1/sibyl-control-build/releases \
            -d '{"tag_name":"'"$TAG"'","name":"Windows build '"$TAG"'","prerelease":true}' > rel.json || true
          # upload asset (follow redirect)
          curl -sfL -X POST -H "Authorization: Bearer $GH_PAT" -H "Content-Type: application/zip" \
            --data-binary @sibyl_control_windows.zip \
            "https://uploads.github.com/repos/preauthn1/sibyl-control-build/releases/$(python -c 'import json;print(json.load(open("rel.json"))["id"])')/assets?name=sibyl_control_windows.zip" || echo UPLOAD_FAILED
          cat sha256.txt
